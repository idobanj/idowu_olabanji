<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline</title>
    <meta name="theme-color" content="#0f172a">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: #0f172a;
            color: #e5e7eb;
            display: grid;
            min-height: 100vh;
            place-items: center;
        }
        .card {
            max-width: 520px;
            padding: 24px;
            border-radius: 12px;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 16px; color: #cbd5e1; }
        .btn {
            appearance: none;
            text-decoration: none;
            background: #eab308;
            color: #111827;
            padding: 10px 16px;
            border-radius: 999px;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card" role="main" aria-label="Offline notice">
        <h1>You're offline</h1>
        <p>The page you requested isn’t available without an internet connection.</p>
        <p>When you’re back online, try reloading this page.</p>
        <a class="btn" href="/">Go to Home</a>
    </main>
</body>
</html>
